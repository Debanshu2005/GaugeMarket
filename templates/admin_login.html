<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — RailQR</title>
<link rel="stylesheet" href="{{ url_for('static', filename='rail.css') }}">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
  body { min-height:100vh; display:flex; flex-direction:column; }
  .auth-page { flex:1; display:flex; align-items:center; justify-content:center; padding:32px 16px; }
  .auth-card { width:100%; max-width:400px; }
  .auth-brand { text-align:center; margin-bottom:28px; }
  .auth-brand img { height:48px; margin-bottom:12px; }
  .auth-brand h1 { font-size:1.5rem; margin-bottom:4px; }
  .auth-brand p { color:var(--ink-3); font-size:.875rem; margin:0; }
</style>
</head>
<body>

<nav class="rq-topbar">
  <div class="rq-topbar-inner">
    <a href="{{ url_for('landing') }}" class="rq-brand">
      <img src="{{ url_for('static', filename='image/rail.png') }}" class="rq-brand-logo" alt="RailQR">
      <span class="rq-brand-name">Rail<span>QR</span></span>
    </a>
  </div>
</nav>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">
      <img src="{{ url_for('static', filename='image/rail.png') }}" alt="Indian Railways">
      <h1>Admin Panel</h1>
      <p>Restricted access — authorised personnel only</p>
    </div>

    <div class="rq-card">
      <div class="rq-card-body">
        {% if error %}
        <div class="alert alert-danger mb-3"><i class="bi bi-shield-exclamation me-2"></i>{{ error }}</div>
        {% endif %}

        <form method="POST">
          {% if request.args.get('next') %}
          <input type="hidden" name="next" value="{{ request.args.get('next') }}">
          {% endif %}
          <div class="mb-4">
            <label class="form-label">Admin Password</label>
            <input type="password" class="form-control" name="password" placeholder="••••••••" required autofocus>
          </div>
          <button type="submit" class="btn btn-primary btn-lg w-100"><i class="bi bi-shield-check"></i> Enter Admin</button>
        </form>
      </div>
    </div>

    <p style="text-align:center;font-size:.8125rem;color:var(--ink-3);margin-top:20px;">© Indian Railways Fittings Department</p>
  </div>
</div>

</body>
</html>
