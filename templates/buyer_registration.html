<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buyer Registration - RailQR</title>
<link rel="stylesheet" href="{{ url_for('static', filename='rail.css') }}">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
  body { min-height:100vh; display:flex; flex-direction:column; }
  .auth-page { flex:1; display:flex; align-items:center; justify-content:center; padding:32px 16px; }
  .auth-card { width:100%; max-width:540px; }
  .auth-brand { text-align:center; margin-bottom:28px; }
  .auth-brand img { height:48px; margin-bottom:12px; }
  .auth-brand h1 { font-size:1.5rem; margin-bottom:4px; }
  .auth-brand p { color:var(--ink-3); font-size:.875rem; margin:0; }
</style>
</head>
<body>

<nav class="rq-topbar">
  <div class="rq-topbar-inner">
    <a href="{{ url_for('landing') }}" class="rq-brand">
      <img src="{{ url_for('static', filename='image/rail.png') }}" class="rq-brand-logo" alt="RailQR">
      <span class="rq-brand-name">Rail<span>QR</span></span>
    </a>
    <div class="rq-topbar-actions">
      <a href="{{ url_for('landing') }}" class="btn btn-outline-light btn-sm"><i class="bi bi-house"></i> Home</a>
      <a href="{{ url_for('buyer_login') }}" class="btn btn-light btn-sm"><i class="bi bi-person-circle"></i> Sign In</a>
    </div>
  </div>
</nav>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">
      <img src="{{ url_for('static', filename='image/rail.png') }}" alt="Indian Railways">
      <h1>Buyer Registration</h1>
      <p>Create a buyer account to speed up checkout and track orders</p>
    </div>

    <div class="rq-card">
      <div class="rq-card-body">
        {% if error %}
        <div class="alert alert-danger mb-3"><i class="bi bi-exclamation-triangle-fill me-2"></i>{{ error }}</div>
        {% endif %}

        <form method="POST">
          <div style="background:var(--paper);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:20px;">
            <p style="font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);margin-bottom:12px;"><i class="bi bi-person-badge me-1"></i>Buyer Details</p>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Full Name <span class="text-danger">*</span></label>
                <input type="text" class="form-control" name="full_name" placeholder="Full name" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Email Address <span class="text-danger">*</span></label>
                <input type="email" class="form-control" name="email" placeholder="you@railway.gov.in" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Phone Number</label>
                <input type="text" class="form-control" name="phone" placeholder="+91 98765 43210">
              </div>
              <div class="col-md-6">
                <label class="form-label">Railway Unit</label>
                <input type="text" class="form-control" name="railway_unit" placeholder="Procurement / Depot / Division">
              </div>
              <div class="col-12">
                <label class="form-label">Password <span class="text-danger">*</span></label>
                <input type="password" class="form-control" name="password" placeholder="Choose a strong password" required>
              </div>
              <div class="col-12">
                <label class="form-label">Default Shipping Address</label>
                <textarea class="form-control" name="shipping_address" rows="3" placeholder="Depot, division, city, state, PIN"></textarea>
              </div>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-lg w-100"><i class="bi bi-person-plus"></i> Create Buyer Account</button>
        </form>

        <div style="text-align:center;margin-top:20px;padding-top:20px;border-top:1px solid var(--border);">
          <p style="font-size:.875rem;color:var(--ink-3);margin:0;">
            Already have an account? <a href="{{ url_for('buyer_login') }}" style="font-weight:600;">Sign in here</a>
          </p>
        </div>
      </div>
    </div>

    <p style="text-align:center;font-size:.8125rem;color:var(--ink-3);margin-top:20px;">Indian Railways Fittings Department</p>
  </div>
</div>

<footer class="rq-footer" style="margin-top:0;">
  Indian Railways Fittings Department &nbsp;·&nbsp; <a href="{{ url_for('landing') }}">Home</a>
</footer>
</body>
</html>
